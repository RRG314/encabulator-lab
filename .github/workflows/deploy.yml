name: Verify and deploy Encabulator Lab

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PAGES_BASE_PATH: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: python3 scripts/audit-publication.py
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:browser

  package:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm ci
      - run: npm run build
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        uses: actions/deploy-pages@v4
        id: deployment
      - name: Confirm published assets
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          site="${SITE_URL%/}"
          index="$(curl -fsSL --retry 7 --retry-all-errors "$site/")"
          case "$index" in *"<title>Encabulator Lab | Turbo Encabulator TE-01</title>"*) ;; *) exit 1 ;; esac
          curl -fsSL --retry 5 --retry-all-errors "$site/models/validation.json" > /tmp/te01-geometry.json
          curl -fsSL --retry 5 --retry-all-errors "$site/models/assembly-conformance.json" > /tmp/assembly-conformance.json
          node -e "const r=require('/tmp/assembly-conformance.json'); if (r.models.length!==8 || r.models.some(m=>m.componentSheets!==m.physicalDefinitions)) process.exit(1)"
          curl -fsSL --retry 5 --retry-all-errors "$site/models/source-conformance.json" > /tmp/source-conformance.json
          node -e "const r=require('/tmp/source-conformance.json'); if (r.configurations.length!==4 || r.configurations.some(m=>m.checks.some(c=>c.status==='OPEN'))) process.exit(1)"
          for page in 801 802; do curl -fsSL --retry 3 "$site/reference/ge-1962/hbk-8359-p$page.jpg" -o /dev/null; done
          for model in TE01 RE01 ME01; do
            case "$model" in TE01) root="$site/models/te01-drawings" ;; RE01) root="$site/models/re01/drawings" ;; ME01) root="$site/models/me01/drawings" ;; esac
            for pose in ASSEMBLY EXPLODED; do curl -fsSL --retry 3 "$root/$model-$pose.svg" -o /dev/null; done
          done
          curl -fsSL --retry 5 --retry-all-errors "$site/models/re01/validation.json" > /tmp/re01-geometry.json
          curl -fsSL --retry 3 --range 0-3 "$site/models/re01/re01.glb" -o /tmp/re01-glb
          curl -fsSL --retry 5 --retry-all-errors "$site/models/me01/validation.json" > /tmp/me01-geometry.json
          curl -fsSL --retry 3 --range 0-3 "$site/models/me01/me01.glb" -o /tmp/me01-glb
          python3 -c 'from pathlib import Path; assert all(Path("/tmp/"+model+"-glb").open("rb").read(4) == b"glTF" for model in ("re01","me01"))'
          node -e "const me=require('/tmp/me01-geometry.json'); if(me.checks.some(c=>c.status==='FAIL')) process.exit(1)"
          node -e "const re=require('/tmp/re01-geometry.json'); if(re.checks.some(c=>c.status==='FAIL')) process.exit(1)"
          node -e "const r=require('/tmp/te01-geometry.json'); if(r.checks.some(c=>c.status==='FAIL')) process.exit(1)"
          for model in ge-1962 chrysler micro-2016 electro-2021 magneto-2022; do
            root="$site/models/archive/$model"
            for pose in assembled exploded; do curl -fsSL --retry 3 "$root/drawings/$pose.svg" -o /dev/null; done
            curl -fsSL --retry 5 --retry-all-errors "$root/manifest.json" -o /tmp/archive-manifest.json
            curl -fsSL --retry 3 --range 0-3 "$root/assembly.glb" -o /tmp/archive.glb
            python3 -c 'from pathlib import Path; import json; assert json.loads(Path("/tmp/archive-manifest.json").read_text())["placements"]; assert Path("/tmp/archive.glb").open("rb").read(4)==b"glTF"'
          done
