name: Verify and deploy TE-01

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: te01-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: python3 scripts/audit-publication.py
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:browser

  package:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm ci
      - run: npm run build
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        uses: actions/deploy-pages@v4
        id: deployment
      - name: Confirm published assets
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          site="${SITE_URL%/}"
          index="$(curl -fsSL --retry 7 --retry-all-errors "$site/")"
          case "$index" in *"Turbo Encabulator TE-01"*) ;; *) exit 1 ;; esac
          curl -fsSL --retry 5 --retry-all-errors "$site/models/validation.json" > /tmp/te01-geometry.json
          curl -fsSL --retry 5 --retry-all-errors "$site/models/re01/validation.json" > /tmp/re01-geometry.json
          curl -fsSL --retry 3 --range 0-3 "$site/models/re01/re01.glb" -o /tmp/re01-glb
          python3 -c 'from pathlib import Path; assert Path("/tmp/re01-glb").open("rb").read(4) == b"glTF"'
          node -e "const re=require('/tmp/re01-geometry.json'); if(re.checks.some(c=>c.status==='FAIL')) process.exit(1)"
          node -e "const r=require('/tmp/te01-geometry.json'); if(r.checks.some(c=>c.status==='FAIL')) process.exit(1)"
