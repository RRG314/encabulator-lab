<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="472" viewBox="0 0 1120 472" role="img" aria-labelledby="title desc">
<title id="title">ME-01 power, thermal and feedback boundaries</title>
<desc id="desc">36 V DC supplies the primary shaft through a motor drive. Torque travels through the coupling and output sleeve. Feedback branches show radial control and the separate cooling circuit. Recovered electrical power returns to the storage or sink.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path fill="#386380" d="M0 0l9 5-9 5z"/></marker>
  <marker id="heat" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="#9a631f" d="M0 0l9 5-9 5z"/></marker>
  <style>
    .title{font:700 26px system-ui,sans-serif;fill:#172e3e}.sub{font:13px ui-monospace,monospace;fill:#456275}
    .label{font:600 15px system-ui,sans-serif;fill:#223e52}.small{font:12px system-ui,sans-serif;fill:#436478}
    .node{fill:#fff;stroke:#a5bac8;stroke-width:1.25}.path{stroke:#386380;stroke-width:2;fill:none;marker-end:url(#arrow)}
    .thermal{stroke:#9a631f;stroke-width:1.7;fill:none;marker-end:url(#heat)}.dash{stroke-dasharray:5 4}
  </style>
</defs>
<rect width="1120" height="472" rx="9" fill="#eef3f6"/>
<rect x=".75" y=".75" width="1118.5" height="470.5" rx="9" fill="none" stroke="#b0c1cd" stroke-width="1.5"/>
<text x="28" y="39" class="title">Metachronic Encabulator ME-01</text>
<text x="29" y="62" class="sub">POWER TRANSFER AND SUPERVISORY FEEDBACK / REVISION 0.1</text>
<path class="path" d="M183 138H216 M368 138H401 M553 138H586 M738 138H771 M923 138H954"/>
<g>
 <rect class="node" x="28" y="103" width="154" height="70" rx="5"/><text class="label" x="40" y="132">36 V DC boundary</text><text class="small" x="40" y="153">Study input</text>
 <rect class="node" x="214" y="103" width="154" height="70" rx="5"/><text class="label" x="226" y="132">Polyphase drive</text><text class="small" x="226" y="153">ME-023 · signed torque</text>
 <rect class="node" x="399" y="103" width="154" height="70" rx="5"/><text class="label" x="411" y="132">Primary waneshaft</text><text class="small" x="411" y="153">ME-005 · J₁, ω₁</text>
 <rect class="node" x="584" y="103" width="154" height="70" rx="5"/><text class="label" x="596" y="132">Girdle coupling</text><text class="small" x="596" y="153">ME-016 / 017 · τc</text>
 <rect class="node" x="769" y="103" width="154" height="70" rx="5"/><text class="label" x="781" y="132">Secondary sleeve</text><text class="small" x="781" y="153">ME-006 · J₂, ω₂</text>
 <rect class="node" x="954" y="103" width="138" height="70" rx="5"/><text class="label" x="966" y="132">Host load</text><text class="small" x="966" y="153">ME-030 · τh</text>
</g>
<path class="path dash" d="M290 174V217H183V253"/>
<path class="path dash" d="M846 174V217H660V253"/>
<path class="path" d="M548 289H507 M353 289H324V206H468V174"/>
<path class="thermal" d="M476 174V194H938V253"/>
<rect class="node" x="78" y="253" width="210" height="71" rx="5"/><text class="label" x="91" y="282">DC-link storage and sink</text><text class="small" x="91" y="304">ME-024 · recovered or dissipated</text>
<rect class="node" x="351" y="253" width="195" height="71" rx="5"/><text class="label" x="364" y="282">Transverse suppression</text><text class="small" x="364" y="304">ME-026 → ME-015 · Y/Z force</text>
<rect class="node" x="566" y="253" width="192" height="71" rx="5"/><text class="label" x="579" y="282">Gram-meter sampling</text><text class="small" x="579" y="304">ME-025 → ME-059 · modal state</text>
<rect class="node" x="811" y="253" width="224" height="71" rx="5"/><text class="label" x="824" y="282">Cooling and bypass loop</text><text class="small" x="824" y="304">ME-020, 022, 041 · heat and Δp</text>
<path class="path" d="M662 325V371H448V326"/><path class="thermal" d="M925 325V367H755"/>
<text class="small" x="541" y="365">Synchronization and bounded control</text>
<text class="small" x="826" y="394">Independent fan supply</text>
<path d="M29 424h35" class="path"/><text class="small" x="73" y="428">Power / actuation</text>
